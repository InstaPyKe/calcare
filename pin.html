    <script>
        function validatePIN() {
            const input = document.getElementById('pinInput');
            const btn = document.querySelector('.btn-continue');
            const pinVal = input.value.trim();
            const isValid = /^\d{4}$/.test(pinVal);
            
            if (isValid) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            }
        }
        
        const eyeIcon = document.querySelector('.eye-icon');
        const eyeOpen = document.querySelector('.eye-open');
        const eyeClosed = document.querySelector('.eye-closed');
        const pinInput = document.getElementById('pinInput');
        eyeIcon.addEventListener('click', () => {
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                pinInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        });
    </script>

    <!-- Interactive Comet Collision Canvas Background -->
    <canvas id="cometCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('cometCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Comet {
                constructor(x, y, vx, vy, radius, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.color = color;
                    this.history = [];
                    this.maxHistory = 15;
                }

                update() {
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.vy = -this.vy;
                    }
                    if (this.y + this.radius > canvas.height) {
                        this.y = canvas.height - this.radius;
                        this.vy = -this.vy;
                    }
                }

                draw() {
                    // Draw realistic flared comet tail
                    for (let i = 0; i < this.history.length; i++) {
                        const ratio = i / this.history.length; // 0 at tail end, 1 at head
                        const tailRadius = this.radius * (1 + (1 - ratio) * 1.2); // Flared tail (gets wider at the back)
                        const opacity = ratio * 0.12; // Fades out at the back
                        
                        ctx.beginPath();
                        ctx.arc(this.history[i].x, this.history[i].y, tailRadius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(186, 230, 253, ${opacity})`;
                        ctx.fill();
                    }

                    // Draw glowing nucleus with radial gradient
                    const nucleusGrad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.radius * 1.5
                    );
                    nucleusGrad.addColorStop(0, '#ffffff'); // Intense white nucleus
                    nucleusGrad.addColorStop(0.2, '#bae6fd'); // Soft sky blue coma
                    nucleusGrad.addColorStop(1, 'rgba(186, 230, 253, 0)'); // Fading outer edge

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = nucleusGrad;
                    ctx.fill();
                }
            }

            const colors = ['#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd'];
            const comets = [];
            const radiusValues = [25, 30, 20, 28, 24];
            
            for (let i = 0; i < 1; i++) {
                const radius = radiusValues[i];
                const x = radius + Math.random() * (canvas.width - radius * 2);
                const y = radius + Math.random() * (canvas.height - radius * 2);
                
                const vx = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                const vy = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                
                comets.push(new Comet(x, y, vx, vy, radius, colors[i]));
            }

            function checkCollisions() {
                for (let i = 0; i < comets.length; i++) {
                    for (let j = i + 1; j < comets.length; j++) {
                        const c1 = comets[i];
                        const c2 = comets[j];

                        const dx = c2.x - c1.x;
                        const dy = c2.y - c1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = c1.radius + c2.radius;

                        if (dist < minDist) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            
                            const tx = -ny;
                            const ty = nx;

                            const dp1 = c1.vx * nx + c1.vy * ny;
                            const dp2 = c2.vx * nx + c2.vy * ny;

                            const dt1 = c1.vx * tx + c1.vy * ty;
                            const dt2 = c2.vx * tx + c2.vy * ty;

                            const new_dp1 = dp2;
                            const new_dp2 = dp1;

                            c1.vx = new_dp1 * nx + dt1 * tx;
                            c1.vy = new_dp1 * ny + dt1 * ty;
                            c2.vx = new_dp2 * nx + dt2 * tx;
                            c2.vy = new_dp2 * ny + dt2 * ty;

                            const overlap = minDist - dist;
                            c1.x -= overlap * nx * 0.5;
                            c1.y -= overlap * ny * 0.5;
                            c2.x += overlap * nx * 0.5;
                            c2.y += overlap * ny * 0.5;
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                checkCollisions();
                comets.forEach(comet => {
                    comet.update();
                    comet.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

            backdrop.addEventListener('click', closeSidebar);

            // Bind to existing hamburger or inject a floating menu indicator
            const existing = document.querySelector('.hamburger-icon, .hamburger-menu');
            if (!existing) {
                const floatHamburg = document.createElement('div');
                floatHamburg.className = 'hamburger-icon';
                floatHamburg.style.width = '22px';
                floatHamburg.style.height = '16px';
                floatHamburg.style.display = 'flex';
                floatHamburg.style.flexDirection = 'column';
                floatHamburg.style.justifyContent = 'space-between';
                floatHamburg.style.cursor = 'pointer';
                
                floatHamburg.innerHTML = `
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                `;
                
                const nav = document.querySelector('.top-nav, .top-bar');
                if (nav) {
                    const backArrow = nav.querySelector('.back-arrow');
                    if (backArrow) {
                        const wrapper = document.createElement('div');
                        wrapper.style.display = 'flex';
                        wrapper.style.alignItems = 'center';
                        wrapper.style.gap = '16px';
                        nav.insertBefore(wrapper, backArrow);
                        wrapper.appendChild(floatHamburg);
                        wrapper.appendChild(backArrow);
                    } else {
                        nav.insertBefore(floatHamburg, nav.firstChild);
                    }
                } else {
                    floatHamburg.style.position = 'fixed';
                    floatHamburg.style.top = '22px';
                    floatHamburg.style.left = '22px';
                    floatHamburg.style.zIndex = '999';
                    document.body.appendChild(floatHamburg);
                }
                floatHamburg.addEventListener('click', openSidebar);
            } else {
                existing.addEventListener('click', (e) => {
                    e.preventDefault();
                    openSidebar();
                });
            }
        })();
    </script>





    <!-- Client Content & Code Protection -->
    <script id="content-protection-js">
        (function() {
            // 1. Disable Right-Click Context Menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // 2. Prevent Copying Outside Form Inputs
            document.addEventListener('copy', function(e) {
                const target = e.target;
                const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
                if (!isInput) {
                    e.preventDefault();
                    return false;
                }
            });

            // 3. Block Developer Tools & Source Inspection Shortcuts
            document.addEventListener('keydown', function(e) {
                // F12
                if (e.key === 'F12' || e.keyCode === 123) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                // Ctrl+Shift+I (DevTools), Ctrl+Shift+J (Console), Ctrl+Shift+C (Inspect Element)
                if (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c', 'K', 'k'].includes(e.key)) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                // Ctrl+U (View Source), Ctrl+S (Save Page)
                if (e.ctrlKey && ['u', 'U', 's', 'S'].includes(e.key)) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });
        })();
    </script>


    <!-- Calcare Professional Notification HUD -->
    <style id="calcare-toast-styles">
        #calcare-toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 420px;
            pointer-events: none;
        }
        .calcare-toast {
            background: rgba(22, 15, 34, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            pointer-events: auto;
            animation: toastSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .calcare-toast.hide {
            opacity: 0;
            transform: translateY(-20px) scale(0.94);
        }
        .calcare-toast-body {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 15px;
        }
        .calcare-toast-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .calcare-toast-content {
            flex: 1;
            text-align: left;
        }
        .calcare-toast-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
            font-family: 'Outfit', sans-serif;
        }
        .calcare-toast-msg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            font-family: 'Outfit', sans-serif;
        }
        .calcare-toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .calcare-toast-close:hover {
            color: #ffffff;
        }
        .calcare-toast-bar {
            height: 3px;
            width: 100%;
            animation: toastProgress linear forwards;
            transform-origin: left;
        }
        @keyframes toastSlideDown {
            from {
                opacity: 0;
                transform: translateY(-25px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastProgress {
            from {
                transform: scaleX(1);
            }
            to {
                transform: scaleX(0);
            }
        }
    </style>
    <script id="calcare-toast-script">
        (function() {
            window.showCalcareNotification = function(message, type = 'error', duration = 4000, title = '') {
                let container = document.getElementById('calcare-toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'calcare-toast-container';
                    document.body.appendChild(container);
                }

                const toast = document.createElement('div');
                toast.className = 'calcare-toast';
                
                let defaultTitle = 'Notification';
                let iconSvg = '';
                let accentColor = '#ffb800';

                if (type === 'error') {
                    defaultTitle = 'Invalid Format / Error';
                    accentColor = '#ff3366';
                    iconSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + accentColor + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
                    try { if (navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch(e) {}
                } else if (type === 'warning') {
                    defaultTitle = 'Action Required';
                    accentColor = '#ffb800';
                    iconSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + accentColor + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
                } else if (type === 'success') {
                    defaultTitle = 'Success';
                    accentColor = '#00FF00';
                    iconSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + accentColor + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="16 9 10 15 7 12"></polyline></svg>';
                } else {
                    defaultTitle = 'Information';
                    accentColor = '#38bdf8';
                    iconSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + accentColor + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
                }

                const displayTitle = title || defaultTitle;

                toast.innerHTML = 
                    '<div class="calcare-toast-body">' +
                        '<div class="calcare-toast-icon-box" style="background:' + accentColor + '1a; border:1px solid ' + accentColor + '33;">' +
                            iconSvg +
                        '</div>' +
                        '<div class="calcare-toast-content">' +
                            '<div class="calcare-toast-title" style="color:' + accentColor + ';">' + displayTitle + '</div>' +
                            '<div class="calcare-toast-msg">' + message + '</div>' +
                        '</div>' +
                        '<button type="button" class="calcare-toast-close" onclick="this.closest(\'.calcare-toast\').remove()">&times;</button>' +
                    '</div>' +
                    '<div class="calcare-toast-bar" style="background:' + accentColor + '; animation-duration:' + duration + 'ms;"></div>';

                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => { try { toast.remove(); } catch(e) {} }, 350);
                }, duration);
            };

            // Override default alert to use the modern HUD
            window.alert = function(msg) {
                window.showCalcareNotification(msg, 'warning', 4500, 'Notice');
            };
        })();
    </script>
