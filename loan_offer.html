<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Special Loan Offer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #2b1f3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
        }

        .hamburger-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #5a3276;
            border-radius: 2px;
        }

        .brand-header {
            margin-bottom: 24px;
        }

        .logo {
            width: 56px;
            height: 56px;
            margin-bottom: 8px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: none;
            color: #2b1f3d;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1f1430;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 24px;
        }

        .loader-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 240px;
        }

        .loader-segment {
            height: 6px;
            border-radius: 3px;
        }

        .seg-1 {
            width: 15%;
            background-color: #ffb800;
        }

        .seg-2 {
            width: 30%;
            background-color: #5a3276;
        }

        .seg-3 {
            width: 45%;
            background-color: #ffb800;
        }

        .seg-4 {
            width: 10%;
            background-color: #5a3276;
        }
    
        /* Magnified Slanted Pure Green Brand Style */
        .brand-name {
            font-family: 'Lobster', cursive !important;
            color: #00FF00 !important;
            font-size: 38px !important;
            font-style: italic !important;
            transform: skewX(-8deg) !important;
            display: inline-block !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6) !important;
        }
        .logo {
            width: 54px !important;
            height: 54px !important;
            fill: #00FF00 !important;
        }
        .logo path {
            stroke: #00FF00 !important;
            fill: none !important;
        }
        .hero-container .brand-name {
            font-size: 72px !important;
        }
        .hero-container .logo {
            width: 90px !important;
            height: 90px !important;
        }
    
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes logoPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .content-container {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .logo {
            animation: logoPulse 4s ease-in-out infinite;
            transform-origin: center;
        }
        .back-arrow:hover {
            background: #e9ecef !important;
            transform: scale(1.05);
        }
        .back-arrow {
            transition: all 0.2s ease !important;
        }
    
    </style>
</head>

<body>
    <div class="top-bar">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <div class="brand-header">
        <svg class="logo" viewBox="0 0 100 100" fill="#00FF00">
            <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z M 15 45 L 50 65 L 85 45 M 15 60 L 50 80 L 85 60" stroke="#00FF00"
                stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand-name">Calcare</div>
    </div>
    <h2>Please wait</h2>
    <p>while we are creating a special loan offer for you...</p>
    <div class="loader-bar">
        <div class="loader-segment seg-1"></div>
        <div class="loader-segment seg-2"></div>
        <div class="loader-segment seg-3"></div>
        <div class="loader-segment seg-4"></div>
    </div>
    <script>
        // Auto redirect to offer calculator screen
        setTimeout(() => { window.location.href = 'loan_calculator.html'; }, 3000);
    </script>
</body>

</html>
