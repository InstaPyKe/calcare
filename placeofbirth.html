<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Step 4 - Place of Birth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: rgba(255, 255, 255, 0.9);
            color: #2b1f3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px 24px 24px;
        }

        .top-nav {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-arrow {
            font-size: 24px;
            color: #5a3276;
            text-decoration: none;
            font-weight: bold;
        }

        .chat-link {
            font-size: 14px;
            color: #5a3276;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 44px;
            height: 44px;
            margin-bottom: 4px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: none;
        }

        .content-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            width: 100%;
            text-align: left;
        }

        .sub-text {
            font-size: 13px;
            color: #444;
            line-height: 1.4;
            margin-bottom: 32px;
            text-align: left;
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 32px;
        }

        .field-label {
            position: absolute;
            top: -10px;
            left: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 0 6px;
            font-size: 12px;
            color: #5a3276;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            height: 56px;
            border: 1.5px solid #5a3276;
            border-radius: 28px;
            padding: 0 20px;
            font-size: 16px;
            color: #2b1f3d;
            outline: none;
        }

        .btn-continue {
            width: 100%;
            padding: 16px;
            background-color: #5a3276;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(90, 50, 118, 0.2);
            letter-spacing: 1px;
        }

        .btn-continue:active {
            transform: scale(0.98);
        }
    
        /* Magnified Slanted Pure Green Brand Style */
        .brand-name {
            font-family: 'Lobster', cursive !important;
            color: #00FF00 !important;
            font-size: 38px !important;
            font-style: italic !important;
            transform: skewX(-8deg) !important;
            display: inline-block !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6) !important;
        }
        .logo {
            width: 54px !important;
            height: 54px !important;
            fill: #00FF00 !important;
        }
        .logo path {
            stroke: #00FF00 !important;
            fill: none !important;
        }
        .hero-container .brand-name {
            font-size: 72px !important;
        }
        .hero-container .logo {
            width: 90px !important;
            height: 90px !important;
        }
    
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes logoPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .content-container {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .logo {
            animation: logoPulse 4s ease-in-out infinite;
            transform-origin: center;
        }
        .back-arrow:hover {
            background: #e9ecef !important;
            transform: scale(1.05);
        }
        .back-arrow {
            transition: all 0.2s ease !important;
        }
    
    </style>
</head>

<body>
    <div class="top-nav">
        <a href="javascript:history.back()" class="back-arrow" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #f1f3f5; border: 1px solid #dee2e6; text-decoration: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a3276" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <a href="#" class="chat-link">Chat with us</a>
    </div>

    <div class="brand-header">
        <svg class="logo" viewBox="0 0 100 100" fill="#00FF00">
            <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z M 15 45 L 50 65 L 85 45 M 15 60 L 50 80 L 85 60" stroke="#00FF00"
                stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand-name">Calcare</div>
    </div>


    <div class="content-container">
        <h2>Registration step 4 out of 6</h2>
        <div class="section-title">Secure your account</div>
        <p class="sub-text">Enter your place of birth below, which will be needed if you forget your PIN.</p>

        <form style="width: 100%;" action="affiliate.html">
            <div class="input-wrapper">
                <span class="field-label">Place of birth</span>
                <input type="text" id="birthInput" class="input-field" placeholder="e.g. Nairobi" required oninput="validateBirthPlace()">
            </div>
            <button type="submit" class="btn-continue" disabled style="opacity: 0.6; cursor: not-allowed;">CONTINUE</button>
        </form>
    </div>
    <script>
        function validateBirthPlace() {
            const input = document.getElementById('birthInput');
            const btn = document.querySelector('.btn-continue');
            const val = input.value.trim();
            const isValid = /^[A-Za-z\s\-']{3,}$/.test(val);
            
            if (isValid) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            }
        }
    </script>

    <!-- Interactive Comet Collision Canvas Background -->
    <canvas id="cometCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('cometCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Comet {
                constructor(x, y, vx, vy, radius, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.color = color;
                    this.history = [];
                    this.maxHistory = 15;
                }

                update() {
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.vy = -this.vy;
                    }
                    if (this.y + this.radius > canvas.height) {
                        this.y = canvas.height - this.radius;
                        this.vy = -this.vy;
                    }
                }

                draw() {
                    if (this.history.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(this.history[0].x, this.history[0].y);
                        for (let i = 1; i < this.history.length; i++) {
                            ctx.lineTo(this.history[i].x, this.history[i].y);
                        }
                        
                        const grad = ctx.createLinearGradient(
                            this.history[0].x, this.history[0].y,
                            this.x, this.y
                        );
                        grad.addColorStop(0, 'transparent');
                        grad.addColorStop(1, this.color + '22');

                        ctx.strokeStyle = grad;
                        ctx.lineWidth = this.radius * 1.5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            const colors = ['#00FF00', '#ffb800', '#00ff88', '#ff3d00', '#5a3276'];
            const comets = [];
            const radiusValues = [25, 30, 20, 28, 24];
            
            for (let i = 0; i < 5; i++) {
                const radius = radiusValues[i];
                const x = radius + Math.random() * (canvas.width - radius * 2);
                const y = radius + Math.random() * (canvas.height - radius * 2);
                
                const vx = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                const vy = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                
                comets.push(new Comet(x, y, vx, vy, radius, colors[i]));
            }

            function checkCollisions() {
                for (let i = 0; i < comets.length; i++) {
                    for (let j = i + 1; j < comets.length; j++) {
                        const c1 = comets[i];
                        const c2 = comets[j];

                        const dx = c2.x - c1.x;
                        const dy = c2.y - c1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = c1.radius + c2.radius;

                        if (dist < minDist) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            
                            const tx = -ny;
                            const ty = nx;

                            const dp1 = c1.vx * nx + c1.vy * ny;
                            const dp2 = c2.vx * nx + c2.vy * ny;

                            const dt1 = c1.vx * tx + c1.vy * ty;
                            const dt2 = c2.vx * tx + c2.vy * ty;

                            const new_dp1 = dp2;
                            const new_dp2 = dp1;

                            c1.vx = new_dp1 * nx + dt1 * tx;
                            c1.vy = new_dp1 * ny + dt1 * ty;
                            c2.vx = new_dp2 * nx + dt2 * tx;
                            c2.vy = new_dp2 * ny + dt2 * ty;

                            const overlap = minDist - dist;
                            c1.x -= overlap * nx * 0.5;
                            c1.y -= overlap * ny * 0.5;
                            c2.x += overlap * nx * 0.5;
                            c2.y += overlap * ny * 0.5;
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                checkCollisions();
                comets.forEach(comet => {
                    comet.update();
                    comet.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

</body>

</html>
