<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Step 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #2b1f3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px 24px 24px;
        }

        .top-nav {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-arrow {
            font-size: 24px;
            color: #5a3276;
            text-decoration: none;
            font-weight: bold;
        }

        .chat-link {
            font-size: 14px;
            color: #5a3276;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 44px;
            height: 44px;
            margin-bottom: 4px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: none;
        }

        .content-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .instruction {
            font-size: 15px;
            color: #333;
            margin-bottom: 4px;
        }

        .sub-instruction {
            font-size: 14px;
            color: #d93838;
            margin-bottom: 20px;
        }

        .id-example-card {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .id-example-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .input-field {
            width: 100%;
            height: 56px;
            border: 1.5px solid #777;
            border-radius: 28px;
            padding: 0 20px;
            font-size: 16px;
            color: #2b1f3d;
            outline: none;
            margin-bottom: 28px;
        }

        .input-field:focus {
            border-color: #5a3276;
        }

        .btn-continue {
            width: 100%;
            padding: 16px;
            background-color: #5a3276;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(90, 50, 118, 0.2);
        }

        /* Magnified Slanted Pure Green Brand Style */
        .brand-name {
            font-family: 'Lobster', cursive !important;
            color: #00FF00 !important;
            font-size: 38px !important;
            font-style: italic !important;
            transform: skewX(-8deg) !important;
            display: inline-block !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6) !important;
        }
        .logo {
            width: 54px !important;
            height: 54px !important;
            fill: #00FF00 !important;
        }
        .logo path {
            stroke: #00FF00 !important;
            fill: none !important;
        }
        .hero-container .brand-name {
            font-size: 72px !important;
        }
        .hero-container .logo {
            width: 90px !important;
            height: 90px !important;
        }
    
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes logoPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .content-container {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .logo {
            animation: logoPulse 4s ease-in-out infinite;
            transform-origin: center;
        }
        .back-arrow:hover {
            background: #e9ecef !important;
            transform: scale(1.05);
        }
        .back-arrow {
            transition: all 0.2s ease !important;
        }
    
    </style>
</head>

<body>
    <div class="top-nav">
        <a href="javascript:history.back()" class="back-arrow" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #f1f3f5; border: 1px solid #dee2e6; text-decoration: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a3276" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <a href="#" class="chat-link">Chat with us</a>
    </div>
    <div class="brand-header">
        <svg class="logo" viewBox="0 0 100 100" fill="#00FF00">
            <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z M 15 45 L 50 65 L 85 45 M 15 60 L 50 80 L 85 60" stroke="#00FF00"
                stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand-name">Calcare</div>
    </div>
    <div class="content-container">
        <h2>Registration step 2 out of 6</h2>
        <p class="instruction">Enter your ID number from your ID card</p>
        <p class="sub-instruction">(see example below)</p>
        <div class="id-example-card" style="position: relative; height: 230px; overflow: hidden; width: 100%; border-radius: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); margin-bottom: 32px;">
            <div class="id-slider-track" style="display: flex; width: 200%; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);">
                <img src="https://tse4.mm.bing.net/th/id/OIP.dFlIeMSrNN-N6jaEGP1dPgHaD4?r=0&pid=Api&h=220&P=0" style="width: 50%; height: 100%; object-fit: contain; background: #eaeaea;" alt="ID Example Front">
                <img src="https://tse3.mm.bing.net/th/id/OIP.Q-Tqeyh_ZERM5gYDBF1ZNQHaEs?r=0&pid=Api&h=220&P=0" style="width: 50%; height: 100%; object-fit: contain; background: #eaeaea;" alt="ID Example Back">
            </div>
            <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;">
                <span class="slide-dot" style="width: 12px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.9); transition: all 0.3s;"></span>
                <span class="slide-dot" style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s;"></span>
            </div>
        </div>
        <form style="width: 100%;" action="pin.html">
            <input type="text" id="idInput" class="input-field" placeholder="National Id" required inputmode="numeric" oninput="validateID()">
            <button type="submit" class="btn-continue" disabled style="opacity: 0.6; cursor: not-allowed;">CONTINUE</button>
        </form>
    </div>
    <script>
        const track = document.querySelector('.id-slider-track');
        const dots = document.querySelectorAll('.slide-dot');
        let index = 0;
        setInterval(() => {
            index = (index + 1) % 2;
            track.style.transform = `translateX(-${index * 50}%)`;
            dots.forEach((dot, idx) => {
                dot.style.background = idx === index ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.3)';
                dot.style.width = idx === index ? '12px' : '8px';
                dot.style.borderRadius = idx === index ? '4px' : '50%';
            });
        }, 2000);
    
        function validateID() {
            const input = document.getElementById('idInput');
            const btn = document.querySelector('.btn-continue');
            const idVal = input.value.trim();
            const isValid = /^\d{7,8}$/.test(idVal);
            
            if (isValid) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            }
        }
    </script>
</body>

</html>
