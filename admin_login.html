<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcare - Admin Security Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080511;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(90, 50, 118, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 184, 0, 0.1) 0%, transparent 50%);
            overflow: hidden;
            position: relative;
        }

        .login-card {
            background: rgba(22, 14, 38, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 184, 0, 0.3);
            border-radius: 32px;
            padding: 42px 32px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(90, 50, 118, 0.25);
            position: relative;
            z-index: 10;
            animation: cardAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top Shield Icon */
        .icon-shield {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.2), rgba(255, 152, 0, 0.1));
            border: 2px solid #ffb800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 184, 0, 0.35);
            color: #ffb800;
        }

        .title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #ffb800;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .email-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s;
        }

        .email-input:focus {
            border-color: #ffb800;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 16px rgba(255, 184, 0, 0.25);
        }

        .email-input.input-error {
            border-color: #ef4444;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
        }

        .email-input.input-success {
            border-color: #00FF00;
            box-shadow: 0 0 16px rgba(0, 255, 0, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ffb800 0%, #ff9800 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 14.5px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 184, 0, 0.35);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 184, 0, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Error Banner */
        .error-banner {
            font-size: 13px;
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 11px 14px;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Return Link */
        .return-link {
            font-size: 12.5px;
            color: #64748b;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            margin-top: 22px;
        }

        .return-link:hover {
            color: #ffb800;
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginCard">
        <div class="icon-shield">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <circle cx="12" cy="11" r="3"></circle>
            </svg>
        </div>

        <h1 class="title">CALCARE SECURITY</h1>
        <p class="subtitle">Enter your authorized administrator email address to authenticate session access.</p>

        <div class="error-banner" id="errorBanner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span>Unauthorized administrator email. Access Denied.</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleEmailAuth(event)">
            <div class="input-group">
                <label class="input-label" for="adminEmail">Administrator Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="adminEmail" class="email-input" placeholder="e.g. admin@calcare.co.ke" autocomplete="email" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span>Authenticate Session</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <a href="index.html" class="return-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Return to User Application
        </a>
    </div>

    <script>
        const AUTHORIZED_EMAIL = 'bravinsimiyu04@gmail.com';
        const card = document.getElementById('loginCard');
        const errorBanner = document.getElementById('errorBanner');
        const emailInput = document.getElementById('adminEmail');
        const btnSubmit = document.getElementById('btnSubmit');

        function handleEmailAuth(e) {
            e.preventDefault();
            const val = emailInput.value.trim().toLowerCase();

            if (val === AUTHORIZED_EMAIL.toLowerCase()) {
                // Success
                emailInput.classList.remove('input-error');
                emailInput.classList.add('input-success');
                errorBanner.style.display = 'none';

                btnSubmit.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span>Access Granted</span>
                `;
                btnSubmit.style.background = '#00FF00';

                // Store authenticated admin session with email
                sessionStorage.setItem('calcare_admin_auth', 'true');
                sessionStorage.setItem('calcare_admin_email', AUTHORIZED_EMAIL);
                sessionStorage.setItem('calcare_admin_auth_time', new Date().toISOString());

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 400);
            } else {
                // Failure
                emailInput.classList.add('input-error');
                card.classList.add('shake');
                errorBanner.style.display = 'flex';

                setTimeout(() => {
                    card.classList.remove('shake');
                }, 600);
            }
        }

        emailInput.addEventListener('input', () => {
            emailInput.classList.remove('input-error');
            errorBanner.style.display = 'none';
        });
    </script>
</body>
</html>
