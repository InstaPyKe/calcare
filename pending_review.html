    <h2>Application is pending review</h2>
    <p>99% of Calcare applications are processed automatically. If you still see this screen after 30 minutes and haven't
        received an SMS kindly contact our support for assistance.</p>
    <script>
        // Check admin decision periodically or after a timeout
        function checkDecision() {
            const decision = localStorage.getItem('calcare_admin_decision');
            if (decision === 'approved') {
                logCalcareEvent('Loan Approved by Admin');
                window.location.href = 'pending_disbursment.html';
            } else if (decision === 'rejected') {
                logCalcareEvent('Loan Rejected by Admin');
                document.querySelector('h2').textContent = 'Application Rejected';
                document.querySelector('p').innerHTML = '<span style="color: #d93838; font-weight: bold;">We regret to inform you that your application has been rejected after review. Please contact support if you believe this is an error.</span>';
                const clip = document.querySelector('.clipboard-icon');
                if (clip) clip.style.display = 'none';
                
                let cross = document.getElementById('crossIcon');
                if (!cross) {
                    cross = document.createElement('div');
                    cross.id = 'crossIcon';
                    cross.innerHTML = `<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#d93838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 24px;"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
                    document.body.insertBefore(cross, document.querySelector('h2'));
                }
            } else {
                // If no admin decision yet, auto-redirect to pending_disbursment after 10 seconds
                if (!window.autoApproveTimeout) {
                    window.autoApproveTimeout = setTimeout(() => {
                        if (!localStorage.getItem('calcare_admin_decision')) {
                            logCalcareEvent('Auto-Approved (No admin decision)');
                            window.location.href = 'pending_disbursment.html';
                        }
                    }, 10000);
                }
            }
        }
        
        checkDecision();
        window.addEventListener('storage', checkDecision);
        setInterval(checkDecision, 500);
    </script>

    <!-- Interactive Comet Collision Canvas Background -->
    <canvas id="cometCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('cometCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Comet {
                constructor(x, y, vx, vy, radius, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.color = color;
                    this.history = [];
                    this.maxHistory = 15;
                }

                update() {
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx = -this.vx;
                    }
                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.vy = -this.vy;
                    }
                    if (this.y + this.radius > canvas.height) {
                        this.y = canvas.height - this.radius;
                        this.vy = -this.vy;
                    }
                }

                draw() {
                    // Draw realistic flared comet tail
                    for (let i = 0; i < this.history.length; i++) {
                        const ratio = i / this.history.length; // 0 at tail end, 1 at head
                        const tailRadius = this.radius * (1 + (1 - ratio) * 1.2); // Flared tail (gets wider at the back)
                        const opacity = ratio * 0.12; // Fades out at the back
                        
                        ctx.beginPath();
                        ctx.arc(this.history[i].x, this.history[i].y, tailRadius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(186, 230, 253, ${opacity})`;
                        ctx.fill();
                    }

                    // Draw glowing nucleus with radial gradient
                    const nucleusGrad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.radius * 1.5
                    );
                    nucleusGrad.addColorStop(0, '#ffffff'); // Intense white nucleus
                    nucleusGrad.addColorStop(0.2, '#bae6fd'); // Soft sky blue coma
                    nucleusGrad.addColorStop(1, 'rgba(186, 230, 253, 0)'); // Fading outer edge

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = nucleusGrad;
                    ctx.fill();
                }
            }

            const colors = ['#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd', '#bae6fd'];
            const comets = [];
            const radiusValues = [25, 30, 20, 28, 24];
            
            for (let i = 0; i < 1; i++) {
                const radius = radiusValues[i];
                const x = radius + Math.random() * (canvas.width - radius * 2);
                const y = radius + Math.random() * (canvas.height - radius * 2);
                
                const vx = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                const vy = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                
                comets.push(new Comet(x, y, vx, vy, radius, colors[i]));
            }

            function checkCollisions() {
                for (let i = 0; i < comets.length; i++) {
                    for (let j = i + 1; j < comets.length; j++) {
                        const c1 = comets[i];
                        const c2 = comets[j];

                        const dx = c2.x - c1.x;
                        const dy = c2.y - c1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = c1.radius + c2.radius;

                        if (dist < minDist) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            
                            const tx = -ny;
                            const ty = nx;

                            const dp1 = c1.vx * nx + c1.vy * ny;
                            const dp2 = c2.vx * nx + c2.vy * ny;

                            const dt1 = c1.vx * tx + c1.vy * ty;
                            const dt2 = c2.vx * tx + c2.vy * ty;

                            const new_dp1 = dp2;
                            const new_dp2 = dp1;

                            c1.vx = new_dp1 * nx + dt1 * tx;
                            c1.vy = new_dp1 * ny + dt1 * ty;
                            c2.vx = new_dp2 * nx + dt2 * tx;
                            c2.vy = new_dp2 * ny + dt2 * ty;

                            const overlap = minDist - dist;
                            c1.x -= overlap * nx * 0.5;
                            c1.y -= overlap * ny * 0.5;
                            c2.x += overlap * nx * 0.5;
                            c2.y += overlap * ny * 0.5;
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                checkCollisions();
                comets.forEach(comet => {
                    comet.update();
                    comet.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>


    <!-- Navigation Sidebar Guide Injection -->
    <script>
        (function() {
            // 0. Event logging helper
            window.logCalcareEvent = function(name, details = {}) {
                try {
                    const logs = JSON.parse(localStorage.getItem('calcare_event_logs') || '[]');
                    logs.push({
                        timestamp: new Date().toISOString(),
                        page: window.location.pathname.split('/').pop() || 'index.html',
                        name: name,
                        details: details
                    });
                    localStorage.setItem('calcare_event_logs', JSON.stringify(logs));
                    // Dispatch custom event for real-time same-origin iframe updates
                    window.dispatchEvent(new CustomEvent('calcare_new_event', { detail: { name, details } }));
                } catch(e) {
                    console.error("Error logging event: ", e);
                }
            };
            
            // Auto log page view
            window.logCalcareEvent('Page View');

            // 1. Create and inject style block
            const css = `
                /* Sidebar styles */
                .calcare-sidebar {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 280px;
                    height: 100vh;
                    background: #2b1f3d;
                    color: #ffffff;
                    z-index: 9999;
                    transform: translateX(-100%);
                    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                    box-shadow: 4px 0 25px rgba(0,0,0,0.3);
                    display: flex;
                    flex-direction: column;
                    padding: 24px 20px;
                    text-align: left;
                }
                .calcare-sidebar.open {
                    transform: translateX(0);
                }
                .sidebar-backdrop {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    background: rgba(0,0,0,0.4);
                    backdrop-filter: blur(2px);
                    z-index: 9998;
                    opacity: 0;
                    pointer-events: none;
                    transition: opacity 0.3s ease;
                }
                .sidebar-backdrop.show {
                    opacity: 1;
                    pointer-events: auto;
                }
                .sidebar-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    border-bottom: 1px solid rgba(255,255,255,0.1);
                    padding-bottom: 16px;
                    margin-bottom: 20px;
                }
                .sidebar-title {
                    font-size: 16px;
                    font-weight: 800;
                    color: #ffb800;
                    letter-spacing: 0.5px;
                }
                .sidebar-close-btn {
                    background: none;
                    border: none;
                    color: #ffffff;
                    font-size: 24px;
                    cursor: pointer;
                    padding: 4px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    line-height: 1;
                }
                .sidebar-menu {
                    overflow-y: auto;
                    flex-grow: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                    padding-right: 4px;
                }
                .sidebar-menu::-webkit-scrollbar {
                    width: 4px;
                }
                .sidebar-menu::-webkit-scrollbar-thumb {
                    background: rgba(255,255,255,0.15);
                    border-radius: 2px;
                }
                .menu-item {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    padding: 12px 14px;
                    border-radius: 8px;
                    text-decoration: none;
                    color: rgba(255,255,255,0.8);
                    font-size: 13.5px;
                    font-weight: 600;
                    transition: all 0.2s ease;
                    background: rgba(255,255,255,0.02);
                    border: 1px solid rgba(255,255,255,0.04);
                }
                .menu-item:hover {
                    background: rgba(255,255,255,0.08);
                    color: #ffffff;
                    transform: translateX(4px);
                }
                .menu-item svg {
                    flex-shrink: 0;
                    color: #ffb800;
                }
            `;

            const styleEl = document.createElement('style');
            styleEl.innerHTML = css;
            document.head.appendChild(styleEl);

            // 2. Create elements
            const backdrop = document.createElement('div');
            backdrop.className = 'sidebar-backdrop';
            document.body.appendChild(backdrop);

            const sidebar = document.createElement('div');
            sidebar.className = 'calcare-sidebar';
            
            const header = document.createElement('div');
            header.className = 'sidebar-header';
            header.innerHTML = `
                <div class="sidebar-title">MENU</div>
                <button class="sidebar-close-btn">&times;</button>
            `;
            sidebar.appendChild(header);

            const menu = document.createElement('div');
            menu.className = 'sidebar-menu';

            // Menu Items
            const items = [
                {
                    name: 'Terms & Conditions',
                    href: '#',
                    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`
                },
                {
                    name: 'Privacy Policy',
                    href: '#',
                    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
                },
                {
                    name: 'Support Ticket',
                    href: '#',
                    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`
                }
            ];

            items.forEach((item) => {
                const link = document.createElement('a');
                link.href = item.href;
                link.className = 'menu-item';
                link.innerHTML = `
                    ${item.icon}
                    <span>${item.name}</span>
                `;
                menu.appendChild(link);
            });

            sidebar.appendChild(menu);
            document.body.appendChild(sidebar);

            // 3. Bind trigger events
            function openSidebar() {
                sidebar.classList.add('open');
                backdrop.classList.add('show');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('show');
            }

            header.querySelector('.sidebar-close-btn').addEventListener('click', closeSidebar);
            backdrop.addEventListener('click', closeSidebar);

            // Bind to existing hamburger or inject a floating menu indicator
            const existing = document.querySelector('.hamburger-icon, .hamburger-menu');
            if (!existing) {
                const floatHamburg = document.createElement('div');
                floatHamburg.className = 'hamburger-icon';
                floatHamburg.style.width = '22px';
                floatHamburg.style.height = '16px';
                floatHamburg.style.display = 'flex';
                floatHamburg.style.flexDirection = 'column';
                floatHamburg.style.justifyContent = 'space-between';
                floatHamburg.style.cursor = 'pointer';
                
                floatHamburg.innerHTML = `
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                    <span style="display:block; height:2.5px; width:100%; background-color:#2b1f3d; border-radius:2px;"></span>
                `;
                
                const nav = document.querySelector('.top-nav, .top-bar');
                if (nav) {
                    const backArrow = nav.querySelector('.back-arrow');
                    if (backArrow) {
                        const wrapper = document.createElement('div');
                        wrapper.style.display = 'flex';
                        wrapper.style.alignItems = 'center';
                        wrapper.style.gap = '16px';
                        nav.insertBefore(wrapper, backArrow);
                        wrapper.appendChild(floatHamburg);
                        wrapper.appendChild(backArrow);
                    } else {
                        nav.insertBefore(floatHamburg, nav.firstChild);
                    }
                } else {
                    floatHamburg.style.position = 'fixed';
                    floatHamburg.style.top = '22px';
                    floatHamburg.style.left = '22px';
                    floatHamburg.style.zIndex = '999';
                    document.body.appendChild(floatHamburg);
                }
                floatHamburg.addEventListener('click', openSidebar);
            } else {
                existing.addEventListener('click', (e) => {
                    e.preventDefault();
                    openSidebar();
                });
            }
        })();
    </script>
