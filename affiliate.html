<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Step 5 - Affiliate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #2b1f3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px 24px 24px;
        }

        .top-nav {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-arrow {
            font-size: 24px;
            color: #5a3276;
            text-decoration: none;
            font-weight: bold;
        }

        .chat-link {
            font-size: 14px;
            color: #5a3276;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 44px;
            height: 44px;
            margin-bottom: 4px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: none;
        }

        .content-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            width: 100%;
            text-align: left;
        }

        .sub-text {
            font-size: 13px;
            color: #444;
            line-height: 1.4;
            margin-bottom: 24px;
            text-align: left;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 32px;
            font-size: 13px;
            text-align: left;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #5a3276;
        }

        .checkbox-group a {
            color: #ffb800;
            text-decoration: underline;
        }

        .btn-continue {
            width: 100%;
            padding: 16px;
            background-color: #5a3276;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(90, 50, 118, 0.2);
        }
    
        /* Magnified Slanted Pure Green Brand Style */
        .brand-name {
            font-family: 'Lobster', cursive !important;
            color: #00FF00 !important;
            font-size: 38px !important;
            font-style: italic !important;
            transform: skewX(-8deg) !important;
            display: inline-block !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6) !important;
        }
        .logo {
            width: 54px !important;
            height: 54px !important;
            fill: #00FF00 !important;
        }
        .logo path {
            stroke: #00FF00 !important;
            fill: none !important;
        }
        .hero-container .brand-name {
            font-size: 72px !important;
        }
        .hero-container .logo {
            width: 90px !important;
            height: 90px !important;
        }
    
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes logoPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .content-container {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .logo {
            animation: logoPulse 4s ease-in-out infinite;
            transform-origin: center;
        }
        .back-arrow:hover {
            background: #e9ecef !important;
            transform: scale(1.05);
        }
        .back-arrow {
            transition: all 0.2s ease !important;
        }
    
    </style>
</head>

<body>
    <div class="top-nav">
        <a href="javascript:history.back()" class="back-arrow" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #f1f3f5; border: 1px solid #dee2e6; text-decoration: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a3276" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <a href="#" class="chat-link">Chat with us</a>
    </div>
    <div class="brand-header">
        <svg class="logo" viewBox="0 0 100 100" fill="#00FF00">
            <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z M 15 45 L 50 65 L 85 45 M 15 60 L 50 80 L 85 60" stroke="#00FF00"
                stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="brand-name">Calcare</div>
    </div>
    <div class="content-container">
        <h2>Registration step 5 out of 6</h2>
        <div class="section-title">Affiliate Program</div>
        <p class="sub-text">If you don't have Promo code, please continue registration process without it.</p>
        <form style="width: 100%;" action="consents.html">
            <div class="checkbox-group">
                <input type="checkbox" id="affiliate">
                <label for="affiliate">I declare I want to join to <a href="#">Affiliate Program</a></label>
            </div>
            <button type="submit" class="btn-continue">CONTINUE</button>
        </form>
    </div>
</body>

</html>
